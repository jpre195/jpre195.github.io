    # title: "Custom Name"
    items:
      - job: "Lead AI Engineer"
        company: "The Walt Disney Company"
        companyUrl: "https://disneyworld.disney.go.com/vacation-planning/?ef_id=CjwKCAiAt4C-BhBcEiwA8Kp0CaIeipW39rTbOx7Uu4SWCtcB9ESuu3mGOpvY2YMuBvs0WhCh6rPirxoC4DIQAvD_BwE:G:s&s_kwcid=AL!5060!3!601103288311!p!!g!!walt%20disney&CMP=KNC-FY25_WDW_TRA_DXF_W365_SCP_SCP_WDWBrand%7CG%7C5251213.RR.AM.01.01%7CM8ZL6TJ%7CBR%7C601103288311&keyword_id=kwd-32346450%7Cdc%7Cwalt%20disney%7C601103288311%7Cp%7C5060:3%7C&gad_source=1&gclid=CjwKCAiAt4C-BhBcEiwA8Kp0CaIeipW39rTbOx7Uu4SWCtcB9ESuu3mGOpvY2YMuBvs0WhCh6rPirxoC4DIQAvD_BwE"
        date: "Aug 2022 - present"
        info:
          enable: false
        featuredLink:
          enable: false
          name: "View the project"
          url: "https://example.com"
        content: |
          I design and launch internal generative-AI tools that streamline the analyst workflow in the Disney Experiences Intelligence (DXi) org. 
          Leveraging OpenAI, Gemini, LangChain, LangGraph, and other modern AI frameworks, I build agents ranging from sentiment and topic-modeling 
          classifiers to sophisticated text-to-SQL engines that automatically translate natural-language queries into efficient SQL statements. 
          These solutions accelerate reporting cycles, reduce manual effort, and increase the precision of insights delivered to senior leadership. 

          ----
          ##### <u>Omni-Channel Analytics Manager (Lead AI/ML Engineer)</u>
          
          _(Apr 2025 - Present)_

          I lead the development of AI-driven analytics pipelines that extract actionable insights from complex omni-channel datasets, informing 
          executive decision-making across DXi. Collaborating with cross-functional teams, I translate business concepts into production-ready 
          code and draft comprehensive technical specifications for seamless handoffs to engineering. I also extend the Model Context Protocol 
          (MCP) server to support advanced AI orchestration and champion AI best-practice adoption across internal forums, driving organizational 
          AI maturity. 

          ----
          ##### <u>Senior Data Scientist</u>
          
          _(Aug 2022 - Apr 2025)_

          Within Revenue Planning & Optimization, I architected data-science products that support high-priority business outcomes. Using Python, 
          SQL, GitLab, Streamlit, Tableau, dbt, and SODA, I built and maintained large-scale, high-quality datasets, established data validation 
          and observability frameworks, and created Teamsbot automations for operations and yield teams. I also mentored junior talent, led an 
          intern project, and presented at the Disney Data Analytics Conferences (2024 & 2025).

      - job: "Data Science Intern"
        company: "Pacific Northwest National Laboratory"
        companyUrl: "https://www.pnnl.gov/"
        date: "Jun 2019 - Aug 2019"
        info:
          enable: false
        featuredLink:
          enable: false
          url: "https://example.com"
        content: |
          Biosurveillance Application team competition sponsored by the Defense Threat Reduction Agency (DTRA) to foster 
          novel and creative approaches for reducing chemical and biological threats. This was a summer internship competition 
          consisting of 3 diverse teams of 4 interns to work together to design and develop a fully functional Android application.
          The application was to be designed to inform warfighters to region-specific risk of infection for various diseases.
          Panel of domain experts judged each application for cash bonuses based on a range of criteria including (but not limited 
          to): overall user experience, model accuracy/effectiveness, and risk assessment. I developed the methodology and
          implementation of the control charts for risk assessment.

