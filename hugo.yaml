  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/hero.png"
    content: |-
      I'm a Lead AI engineer at The Walt Disney Company, using statistical expertise and generative-AI tools to streamline 
      analytics, reporting, and decision-making. With a strong foundation in computer science, statistics, and mathematics, I build end-to-end 
      solutions that transform complex business queries into executable code and intuitive visualisations. My core toolkit includes Python, SQL, 
      LangChain, LangGraph, Streamlit, and Docker, and I routinely architect RAG chatbots, text-to-SQL agents, and automated reporting pipelines 
      that save hundreds of manual hours per quarter. Outside of work, I value time with my family and enjoy competing in local bowling leagues.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with and developing recently:"
