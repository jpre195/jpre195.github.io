  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Quarterly Assessment Automation
        content: Architected an end-to-end AI reporting system for Disney Experiences, automating quarterly performance analysis and macro-economic forecasting across WDW, Disneyland, and Disney Cruise Line. Built a multi-agent orchestration layer with LangGraph and LangChain, a FastAPI+FastMCP backend, Dockerized deployment on Disney Private Cloud, and a MariaDB cache plus S3 audio layer. Integrated a Chroma-powered RAG chatbot and text-to-audio pipeline, eliminating 400 manual hours per quarter and boosting reporting frequency and executive visibility.
        image: /images/projects/automated_reporting.jpg
        badges:
          - LangChain
          - LangGraph
          - Streamlit
          - FastAPI
          - FastMCP
          - MariaDB
          - Docker
          - S3
          - Chroma
      - title: Data Catalog Agent
        content: Designed and released an enterprise-grade Text-to-SQL agent that translates natural-language business inquiries into executable SQL queries. Implemented a RAG-based contextual layer using the CIMA data catalog and Chroma to ensure high-precision query generation, while adding custom guardrails to mitigate hallucination and auto-route specialized requests. The production stack features a Chainlit frontend, FastAPI backend, and MCP integration, running on Cloudera AI.
        image: /images/projects/data_catalog_agent.png
        badges:
          - Python
          - LangChain
          - LangGraph
          - FastAPI
          - Chainlit
          - Chroma
          - Alation
      - title: AI Training Agent
        content: Created an AI training agent to accelerate AI literacy for Disney Cast Members. Developed a high-precision RAG pipeline using ChromaDB and LangChain/LangGraph for personalized, context-aware training modules. Built a Chainlit UI with a FastAPI backend orchestrated via Langflow, and presented the tool's capabilities at the 2026 Disney AI Summit, demonstrating its impact on organizational AI readiness.
        image: /images/projects/training_ai.png
        badges:
          - Python
          - Langflow
          - FastAPI
          - Chroma
          - LangChain
          - LangGraph
          - Chainlit
      - title: Chart Generation MCP Tool
        content: Developed a Model Context Protocol (MCP) tool that programmatically transforms natural-language prompts into sophisticated data visualisations. The system auto-generates executable Python code and an automated rendering pipeline that outputs charts instantly, ensuring brand consistency by enforcing CIMA styling guidelines across all visual assets.
        image: /images/projects/chart_mcp_tool.png
        badges:
          - Python
          - FastMCP
          - Plotly
          - LangChain
          - LangGraph
      - title: Incentive Chatbot
        content: Built a RAG chatbot for Disney Central call center agent progression queries. This chatbot can answer questions about documentation for when call center agents can be promoted to the next stage in their training.
        image: /images/projects/chatbot.jpg
        badges:
          - Python
          - LangChain
          - LangGraph
          - Chainlit
          - FastAPI
      - title: Attendance Forecasting Model
        content: Developed a model to forecast 7 days of future attendance at WDW theme parks for Yield Optimization team to enact ticket stop-sales
        image: /images/projects/forecasting.jpg
        badges:
          - "Python"
          - "GitLab"
          - "dbt"
          - "scikit-learn"
          - "ruff"
          - "MLFlow"
